[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts = 
    -v
    --strict-markers

markers =
    ui: UI tests
    api: API tests
    ai: AI tests
    smoke: Smoke tests
    regression: Regression tests
    security: AI security tests
    prompt_injection: prompt injection tests
    jailbreak: jailbreak tests




filterwarnings =
    ignore:There is no current event loop:DeprecationWarning
    ignore:.*HallucinationMetric.*:DeprecationWarning
